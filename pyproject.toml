[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "torch-memory-budget-rng-guard"
version = "0.1.0"
description = "Guards a real PyTorch correctness bug (pytorch/pytorch#190758): torch.compile's activation_memory_budget partitioner can force an RNG op (dropout, randn_like) to recompute with FRESH randomness in the backward pass, silently applying a different mask than the forward used and corrupting gradients with no error or warning"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "zhuhroscar-tech" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]
torch = ["torch>=2.0"]

[project.scripts]
torch-memory-budget-rng-guard = "torch_memory_budget_rng_guard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
